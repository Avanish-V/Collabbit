# Memory settings
# Increased RAM for Gradle and Kotlin daemon
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvm.options=-Xmx4096m

# Gradle performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Kotlin performance
kotlin.incremental=true
kotlin.incremental.multiplatform=true
# Use daemon execution for better stability and parallel builds
kotlin.compiler.execution.strategy=daemon

# Android settings
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.databinding.incremental=true

# KSP
ksp.incremental=true
ksp.incremental.intermodule=true

# Housekeeping
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
