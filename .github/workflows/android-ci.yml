
name: Android CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Sign Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      # 1. Run unit tests
      - name: Run Unit Tests
        run: ./gradlew :feature:profile:testDebugUnitTest

      # 2. Build Debug APKs
      - name: Build Debug APKs
        run: ./gradlew assembleDebug

      # 3. Upload Debug APKs
      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: collabbit-debug-apks
          path: |
            app/build/outputs/apk/dev/debug/app-dev-debug.apk
            app/build/outputs/apk/prod/debug/app-prod-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 4. Decode production keystore only on push to main
      - name: Decode Release Keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/collabbit-release.jks
          chmod 600 app/collabbit-release.jks

      # 5. Build signed production AAB only on push to main
      - name: Build Production Release AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleProdRelease

      # 6. Upload production AAB
      - name: Upload Production AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: collabbit-production-aab
          path: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
          retention-days: 14

      # 7. Remove temporary keystore
      - name: Cleanup Release Keystore
        if: always()
        run: rm -f app/collabbit-release.jks
