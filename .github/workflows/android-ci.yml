
name: Android CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Sign Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      # 1. Run unit tests
      - name: Run Unit Tests
        run: ./gradlew :feature:profile:testDebugUnitTest

      # 2. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 3. Decode production keystore
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/collabbit-release.jks
          chmod 600 app/collabbit-release.jks

      # 4. Generate signed Release AAB
      - name: Build Signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

         # Get generated ABB
      - name: Find Generated AAB
        run: |
          echo "Searching for AAB files..."
          find . -type f -name "*.aab"  

      # 5. Upload AAB to GitHub
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: collabbit-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
